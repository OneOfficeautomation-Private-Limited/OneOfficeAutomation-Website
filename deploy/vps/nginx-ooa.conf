# Nginx site for the VPS: /etc/nginx/sites-available/ooa  (then: ln -s to sites-enabled, nginx -t, systemctl reload nginx).
# Run "certbot --nginx -d oneofficeautomation.com -d www.oneofficeautomation.com" afterwards; it adds the HTTPS part and the redirect.
# Replace the domain below if yours differs.

server {
    listen 80;
    listen [::]:80;
    server_name oneofficeautomation.com www.oneofficeautomation.com;

    # Admin media uploads go up to 6 MB and catalog imports up to 10 MB.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;            # lets the footer video seek and stream
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 60s;
    }
}
